<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>China provinces with details</title>
    <script src="https://assets.pyecharts.org/assets/v6/echarts.min.js"></script>
    <script src="https://assets.pyecharts.org/assets/v6/maps/china.js"></script>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #edf5ff, #e5eefc 40%, #f8fbff 100%);
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1400px;
            margin: 24px auto;
            padding: 18px 22px 26px;
            background: rgba(255,255,255,0.75);
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(26, 56, 110, 0.12);
            border: 1px solid rgba(71, 117, 198, 0.15);
        }

        .title {
            text-align: center;
            font-weight: 700;
            color: #123b72;
            font-size: 18px;
            margin-bottom: 12px;
        }

        .chart-container {
            width: 100%;
            height: 760px;
            border-radius: 14px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">China provinces: hover for details</div>
        <div id="chinaMap" class="chart-container"></div>
    </div>

    <script>
        var chart = echarts.init(document.getElementById('chinaMap'), 'white', { renderer: 'canvas', locale: 'ES' });

        var provinceData = [
            { name: '北京', label: 'Beijing', value: 120, area: '16,410.54 km²', population: '21.9 million', capital: 'Beijing' },
            { name: '天津', label: 'Tianjin', value: 90, area: '11,916.7 km²', population: '13.9 million', capital: 'Tianjin' },
            { name: '河北', label: 'Hebei', value: 140, area: '188,800 km²', population: '74.6 million', capital: 'Shijiazhuang' },
            { name: '山西', label: 'Shanxi', value: 110, area: '156,700 km²', population: '34.5 million', capital: 'Taiyuan' },
            { name: '内蒙古', label: 'Inner Mongolia', value: 80, area: '1,183,000 km²', population: '24.6 million', capital: 'Hohhot' },
            { name: '辽宁', label: 'Liaoning', value: 130, area: '145,900 km²', population: '42.9 million', capital: 'Shenyang' },
            { name: '吉林', label: 'Jilin', value: 100, area: '187,400 km²', population: '24.1 million', capital: 'Changchun' },
            { name: '黑龙江', label: 'Heilongjiang', value: 120, area: '473,000 km²', population: '31.9 million', capital: 'Harbin' },
            { name: '上海', label: 'Shanghai', value: 150, area: '6,340.5 km²', population: '24.9 million', capital: 'Shanghai' },
            { name: '江苏', label: 'Jiangsu', value: 200, area: '102,600 km²', population: '84.8 million', capital: 'Nanjing' },
            { name: '浙江', label: 'Zhejiang', value: 180, area: '101,800 km²', population: '64.4 million', capital: 'Hangzhou' },
            { name: '安徽', label: 'Anhui', value: 130, area: '139,600 km²', population: '61.0 million', capital: 'Hefei' },
            { name: '福建', label: 'Fujian', value: 120, area: '121,400 km²', population: '41.5 million', capital: 'Fuzhou' },
            { name: '江西', label: 'Jiangxi', value: 110, area: '167,000 km²', population: '45.2 million', capital: 'Nanchang' },
            { name: '山东', label: 'Shandong', value: 210, area: '157,900 km²', population: '101.5 million', capital: 'Jinan' },
            { name: '河南', label: 'Henan', value: 170, area: '167,000 km²', population: '99.4 million', capital: 'Zhengzhou' },
            { name: '湖北', label: 'Hubei', value: 160, area: '185,900 km²', population: '57.7 million', capital: 'Wuhan' },
            { name: '湖南', label: 'Hunan', value: 150, area: '211,800 km²', population: '66.4 million', capital: 'Changsha' },
            { name: '广东', label: 'Guangdong', value: 220, area: '179,800 km²', population: '126.0 million', capital: 'Guangzhou' },
            { name: '广西', label: 'Guangxi', value: 95, area: '236,700 km²', population: '50.1 million', capital: 'Nanning' },
            { name: '海南', label: 'Hainan', value: 70, area: '35,400 km²', population: '10.5 million', capital: 'Haikou' },
            { name: '重庆', label: 'Chongqing', value: 90, area: '82,400 km²', population: '32.1 million', capital: 'Chongqing' },
            { name: '四川', label: 'Sichuan', value: 170, area: '486,000 km²', population: '83.6 million', capital: 'Chengdu' },
            { name: '贵州', label: 'Guizhou', value: 100, area: '176,200 km²', population: '38.6 million', capital: 'Guiyang' },
            { name: '云南', label: 'Yunnan', value: 110, area: '394,000 km²', population: '47.2 million', capital: 'Kunming' },
            { name: '西藏', label: 'Tibet', value: 50, area: '1,228,000 km²', population: '3.7 million', capital: 'Lhasa' },
            { name: '陕西', label: 'Shaanxi', value: 120, area: '205,600 km²', population: '39.5 million', capital: 'Xi\'an' },
            { name: '甘肃', label: 'Gansu', value: 80, area: '425,800 km²', population: '25.4 million', capital: 'Lanzhou' },
            { name: '青海', label: 'Qinghai', value: 60, area: '720,000 km²', population: '6.0 million', capital: 'Xining' },
            { name: '宁夏', label: 'Ningxia', value: 55, area: '66,400 km²', population: '7.5 million', capital: 'Yinchuan' },
            { name: '新疆', label: 'Xinjiang', value: 90, area: '1,664,900 km²', population: '25.9 million', capital: 'Ürümqi' },
            { name: '台湾', label: 'Taiwan', value: 100, area: '36,000 km²', population: '23.6 million', capital: 'Taipei' },
            { name: '香港', label: 'Hong Kong', value: 65, area: '1,104 km²', population: '7.5 million', capital: 'Hong Kong' },
            { name: '澳门', label: 'Macao', value: 30, area: '32.9 km²', population: '0.7 million', capital: 'Macao' }
        ];

        var nameMap = {
            '北京': 'Beijing', '天津': 'Tianjin', '河北': 'Hebei', '山西': 'Shanxi',
            '内蒙古': 'Inner Mongolia', '辽宁': 'Liaoning', '吉林': 'Jilin', '黑龙江': 'Heilongjiang',
            '上海': 'Shanghai', '江苏': 'Jiangsu', '浙江': 'Zhejiang', '安徽': 'Anhui',
            '福建': 'Fujian', '江西': 'Jiangxi', '山东': 'Shandong', '河南': 'Henan',
            '湖北': 'Hubei', '湖南': 'Hunan', '广东': 'Guangdong', '广西': 'Guangxi',
            '海南': 'Hainan', '重庆': 'Chongqing', '四川': 'Sichuan', '贵州': 'Guizhou',
            '云南': 'Yunnan', '西藏': 'Tibet', '陕西': 'Shaanxi', '甘肃': 'Gansu',
            '青海': 'Qinghai', '宁夏': 'Ningxia', '新疆': 'Xinjiang', '台湾': 'Taiwan',
            '香港': 'Hong Kong', '澳门': 'Macao'
        };

        var spanishProvinceNames = {
            '北京': 'Pekín', '天津': 'Tianjin', '河北': 'Hebei', '山西': 'Shanxi',
            '内蒙古': 'Mongolia Interior', '辽宁': 'Liaoning', '吉林': 'Jilin', '黑龙江': 'Heilongjiang',
            '上海': 'Shanghái', '江苏': 'Jiangsu', '浙江': 'Zhejiang', '安徽': 'Anhui',
            '福建': 'Fujian', '江西': 'Jiangxi', '山东': 'Shandong', '河南': 'Henan',
            '湖北': 'Hubei', '湖南': 'Hunan', '广东': 'Cantón', '广西': 'Guangxi',
            '海南': 'Hainan', '重庆': 'Chongqing', '四川': 'Sichuan', '贵州': 'Guizhou',
            '云南': 'Yunnan', '西藏': 'Tíbet', '陕西': 'Shaanxi', '甘肃': 'Gansu',
            '青海': 'Qinghai', '宁夏': 'Ningxia', '新疆': 'Sinkiang', '台湾': 'Taiwán',
            '香港': 'Hong Kong', '澳门': 'Macao'
        };

        var spanishCapitalNames = {
            '北京': 'Pekín', '天津': 'Tianjin', '河北': 'Shijiazhuang', '山西': 'Taiyuan',
            '内蒙古': 'Hohhot', '辽宁': 'Shenyang', '吉林': 'Changchun', '黑龙江': 'Harbin',
            '上海': 'Shanghái', '江苏': 'Nankín', '浙江': 'Hangzhou', '安徽': 'Hefei',
            '福建': 'Fuzhou', '江西': 'Nanchang', '山东': 'Jinan', '河南': 'Zhengzhou',
            '湖北': 'Wuhan', '湖南': 'Changsha', '广东': 'Cantón', '广西': 'Nanning',
            '海南': 'Haikou', '重庆': 'Chongqing', '四川': 'Chengdu', '贵州': 'Guiyang',
            '云南': 'Kunming', '西藏': 'Lhasa', '陕西': 'Xián', '甘肃': 'Lanzhou',
            '青海': 'Xining', '宁夏': 'Yinchuan', '新疆': 'Ürümqi', '台湾': 'Taipéi',
            '香港': 'Hong Kong', '澳门': 'Macao'
        };

        var mapData = provinceData.map(function (item) {
            var area = Number(String(item.area).replace(/[^0-9.]/g, ''));
            var population = Number.parseFloat(String(item.population).replace(/[^0-9.]/g, '')) * 1000000;
            var chineseName = item.name;

            return {
                name: chineseName,
                nameZh: chineseName,
                value: item.value,
                nameEn: item.label,
                nameEs: spanishProvinceNames[item.name] || item.label,
                area: Number.isFinite(area) ? area : null,
                population: Number.isFinite(population) ? population : null,
                capital: item.capital,
                ciudad_es: spanishCapitalNames[item.name] || item.capital,
                aliases: [
                    item.name + '省',
                    item.name + '市',
                    item.name + '自治区',
                    item.name + '特别行政区'
                ]
            };
        });

        function normalizeProvinceName(name) {
            if (!name) return '';
            return String(name)
                .toLowerCase()
                .replace(/壮族自治区|回族自治区|维吾尔自治区|特别行政区|自治区/g, '')
                .replace(/壮族|回族|维吾尔/g, '')
                .replace(/省|市/g, '')
                .replace(/[\s_-]+/g, '')
                .trim();
        }

        function getProvinceInfo(params) {
            var data = params && params.data;
            var rawName = (params && params.name) || (data && (data.nameZh || data.name)) || '';
            var normalizedName = normalizeProvinceName(rawName);
            var item = mapData.find(function (d) {
                return d.name === rawName
                    || d.nameZh === rawName
                    || d.nameEs === rawName
                    || d.nameEn === rawName
                    || d.aliases.indexOf(rawName) !== -1
                    || normalizeProvinceName(d.name) === normalizedName
                    || normalizeProvinceName(d.nameEs) === normalizedName
                    || normalizeProvinceName(d.nameEn) === normalizedName;
            });

            if (item) return item;
            if (params && Number.isInteger(params.dataIndex) && mapData[params.dataIndex]) {
                return mapData[params.dataIndex];
            }
            return data || {};
        }

        var option = {
            title: {
                text: 'China por provincias',
                subtext: 'Pasa el cursor sobre cada provincia',
                left: 'center',
                textStyle: { color: '#123b72', fontWeight: 'bold', fontSize: 20 },
                subtextStyle: { color: '#3f5d8a', fontSize: 12 }
            },
            tooltip: {
                trigger: 'item',
                formatter: function (params) {
                    var info = getProvinceInfo(params);
                    var provinceNameEnglish = info.nameEn || '-';
                    var provinceNameSpanish = info.nameEs || '-';
                    var area = typeof info.area === 'number' && Number.isFinite(info.area)
                        ? info.area.toLocaleString() + ' km²'
                        : '-';
                    var population = typeof info.population === 'number' && Number.isFinite(info.population)
                        ? info.population.toLocaleString()
                        : '-';
                    var capital = info.ciudad_es || info.capital || '-';

                    return [
                        '<div style="min-width:220px; padding:8px 10px; line-height:1.7;">',
                        '  <div style="font-weight:bold; font-size:15px; margin-bottom:6px;">' + provinceNameSpanish + '</div>',
                        '  <div><b>Nombre en inglés:</b> ' + provinceNameEnglish + '</div>',
                        '  <div><b>Nombre en español:</b> ' + provinceNameSpanish + '</div>',
                        '  <div><b>Superficie:</b> ' + area + '</div>',
                        '  <div><b>Población:</b> ' + population + '</div>',
                        '  <div><b>Ciudad principal:</b> ' + capital + '</div>',
                        '</div>'
                    ].join('');
                }
            },
            visualMap: {
                min: 0,
                max: 220,
                left: 'right',
                top: 'middle',
                orient: 'vertical',
                text: ['Alta', 'Baja'],
                calculable: true,
                inRange: {
                    color: ['#eaf4ff', '#b0d7ff', '#6ea8ff', '#3d7af0', '#1f4fb3', '#122f73']
                }
            },
            series: [{
                type: 'map',
                map: 'china',
                nameMap: nameMap,
                roam: true,
                label: {
                    show: true,
                    color: '#333',
                    fontSize: 10,
                    formatter: function (params) {
                        return params.data ? (params.data.nameEs || params.name) : params.name;
                    }
                },
                data: mapData,
                emphasis: {
                    label: {
                        show: true,
                        fontWeight: 'bold',
                        color: '#04213d'
                    },
                    itemStyle: {
                        areaColor: '#ffd166'
                    }
                }
            }]
        };

        chart.setOption(option);
    </script>
</body>
</html>
